{% extends "base.html" %}
{% block title %}Create Account — Hodophile{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card reveal">
    <div class="auth-logo">✦ Hodophile</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join thousands of wanderers on Hodophile</p>
    <form method="POST" action="{{ url_for('signup') }}" class="auth-form" id="signupForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required autocomplete="new-password">
          <button type="button" class="toggle-pass" onclick="togglePassword('password')">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-icon-wrap">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
          <button type="button" class="toggle-pass" onclick="togglePassword('confirm_password')">👁</button>
        </div>
        <div class="field-hint" id="passMatch"></div>
      </div>
      <button type="submit" class="btn btn-gold btn-full">Create Account ✦</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <div class="auth-switch">
      Already have an account? <a href="{{ url_for('login') }}">Sign In →</a>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
const pw = document.getElementById('password');
const cpw = document.getElementById('confirm_password');
const hint = document.getElementById('passMatch');
cpw.addEventListener('input', () => {
  if (!cpw.value) { hint.textContent = ''; return; }
  if (pw.value === cpw.value) {
    hint.textContent = '✓ Passwords match'; hint.className = 'field-hint success';
  } else {
    hint.textContent = '✕ Passwords do not match'; hint.className = 'field-hint error';
  }
});
</script>
{% endblock %}
